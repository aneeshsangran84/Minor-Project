{% extends 'base.html' %}
{% block content %}
<section class="auth-panel"><p class="eyebrow">SECOND FACTOR</p><h1>Connect your authenticator</h1>
<p>Scan this QR code with your authenticator app, or enter the setup key manually. Keep the key private.</p>
<div class="qr">{{ qr }}</div><details><summary>Manual setup key</summary><code class="secret">{{ secret }}</code><p>Type: TOTP · 6 digits · 30 seconds · SHA-1.</p></details>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="code">Current six-digit code</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button class="button full">Confirm authenticator</button></form></section>
{% endblock %}
