{% extends 'base.html' %}
{% block content %}
<section class="auth-panel"><p class="eyebrow">EXTRA VERIFICATION</p><h1>Confirm it is you</h1><p>Action: <strong>{{ purpose }}</strong>. Verify with your password and a fresh authenticator or recovery code.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required><label for="code">Authenticator or unused recovery code</label><input id="code" name="code" autocomplete="one-time-code" maxlength="40" required><button class="button full">Verify</button></form><p>Codes cannot be reused. Wait for a new code if you just signed in.</p></section>
{% endblock %}
